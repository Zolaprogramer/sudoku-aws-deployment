  h1 { font-size: 2rem; margin-bottom: 10px; letter-spacing: 4px; color: #e94560; }
  #timer { font-size: 1.4rem; margin-bottom: 16px; color: #a8dadc; font-variant-numeric: tabular-nums; }
  .diff-buttons { display: flex; gap: 12px; margin-bottom: 24px; }
  .diff-buttons button {
    padding: 10px 28px;
    border: 2px solid #e94560;
    background: transparent;
    color: #eee;
    font-size: 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .diff-buttons button:hover, .diff-buttons button.active {
    background: #e94560;
    color: #fff;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 0;
    border: 3px solid #e94560;
    width: min(90vw, 450px);
    height: min(90vw, 450px);
  }
  .cell {
    border: 1px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(14px, 4vw, 22px);
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    aspect-ratio: 1;
  }
  .cell:nth-child(3n) { border-right: 2px solid #a8dadc; }
  .cell:nth-child(9n) { border-right: none; }
  .cell[data-row="2"], .cell[data-row="5"] { border-bottom: 2px solid #a8dadc; }
  .cell.given { color: #fff; background: #16213e; }
  .cell.editable { color: #a8dadc; background: #0f3460; }
  .cell.selected { background: #e9456033 !important; }
  .cell.error { color: #ff6b6b !important; }
  .cell.correct { color: #6bffb8 !important; }
  input.cell-input {
    width: 100%; height: 100%;
    border: none; background: transparent;
    color: inherit; font-size: inherit;
    font-weight: bold; text-align: center;
    outline: none; caret-color: transparent;
  }
  #controls { display: flex; gap: 12px; margin-top: 20px; }
  #controls button {
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  #check-btn { background: #a8dadc; color: #1a1a2e; }
  #new-btn { background: #e94560; color: #fff; }
  #message {
    margin-top: 16px;
    font-size: 1.1rem;
    min-height: 24px;
    font-weight: bold;
  }
  .win { color: #6bffb8; }
  .fail { color: #ff6b6b; }

  /* --- Free-tier paywall gates --- */
  #mistake-counter { margin-top: 6px; font-size: 0.95rem; color: #a8dadc; }

  .diff-buttons button.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(40%); }
  .diff-buttons button.locked .lock-icon { margin-left: 4px; }

  #hint-btn { background: #a8dadc; color: #1a1a2e; }
  #hint-btn:disabled, #hint-btn.hint-used { opacity: 0.5; cursor: not-allowed; filter: grayscale(60%); }

  #board.frozen { pointer-events: none; filter: blur(2px) grayscale(30%); transition: filter 0.2s ease; }

  .paywall-modal-overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.45);
  }
  .paywall-modal.glass {
    width: min(420px, 90vw);
    padding: 32px 28px;
    border-radius: 20px;
    text-align: center;
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }
  .paywall-modal.glass h2 { margin: 0 0 12px; font-size: 1.4rem; }
  .paywall-modal.glass p { margin: 0 0 24px; font-size: 0.95rem; line-height: 1.5; color: rgba(255,255,255,0.85); }
  .paywall-modal-actions { display: flex; flex-direction: column; gap: 10px; }
  .btn-neon {
    padding: 12px 20px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; color: #0b0f14; background: #39ff88;
    box-shadow: 0 0 8px #39ff88, 0 0 20px rgba(57,255,136,0.6);
  }
  .btn-ghost {
    padding: 10px 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 12px;
    background: transparent; color: rgba(255,255,255,0.85); font-size: 0.9rem; cursor: pointer;
  }

  #neon-gameover-screen {
    position: fixed; inset: 0; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6, 0, 0, 0.92);
  }
  .neon-gameover-content { text-align: center; }
  .neon-text-red {
    margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 800; letter-spacing: 0.08em;
    color: #ff1744;
    text-shadow: 0 0 8px #ff1744, 0 0 20px #ff1744, 0 0 40px #ff0033, 0 0 80px #ff0033;
    animation: neon-flicker 1.6s infinite alternate;
  }
  .neon-subtext { margin-top: 12px; color: rgba(255,255,255,0.75); font-size: 1rem; }
  .btn-neon-red {
    margin-top: 28px; padding: 12px 28px; border: 1px solid #ff1744; border-radius: 12px;
    background: rgba(255,23,68,0.12); color: #ff1744; font-size: 1rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 0 8px rgba(255,23,68,0.6), inset 0 0 8px rgba(255,23,68,0.3);
  }
  @keyframes neon-flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% {
      opacity: 1;
      text-shadow: 0 0 8px #ff1744, 0 0 20px #ff1744, 0 0 40px #ff0033, 0 0 80px #ff0033;
    }
    20%, 24%, 55% { opacity: 0.4; text-shadow: none; }
  }

  .rate-limit-overlay {
    position: absolute; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  }
  .rate-limit-content { text-align: center; color: #fff; }
  .rate-limit-content p { margin: 0; }
  .freeze-timer { margin-top: 6px; font-size: 1.6rem; font-weight: 700; color: #ffb300; text-shadow: 0 0 10px rgba(255,179,0,0.7); }
</style>
</head>
<body>
<h1>SUDOKU</h1>
<div id="timer">00:00</div>
<div id="mistake-counter">Mistakes: 0/4</div>
<div class="diff-buttons">
  <button onclick="requestNewGame('easy')" id="btn-easy" data-difficulty="easy">Easy</button>
  <button onclick="requestNewGame('mid')" id="btn-mid" data-difficulty="mid">Mid</button>
  <button onclick="requestNewGame('hard')" id="btn-hard" data-difficulty="hard">Hard</button>
  <button onclick="requestNewGame('expert')" id="btn-expert" data-difficulty="expert">Expert</button>
</div>
<div id="board"></div>
<div id="controls">
  <button id="check-btn" onclick="checkBoard()">Check</button>
  <button id="hint-btn" onclick="useHint()">Hint (1)</button>
  <button id="new-btn" onclick="requestNewGame(currentDiff)">New Game</button>
</div>
<div id="message"></div>

<script>
let puzzle = [], solution = [], currentDiff = 'easy';
let timerInterval = null, seconds = 0, gameOver = false;
let mistakeCount = 0, hintsUsed = 0;

// --- 0. Mock-mode config (0.00 KM sandbox, no payment gateway / DB calls) ---
const MOCK_MODE = true;
const PAYWALL = {
  FREE_DAILY_GAMES: 3,
  MAX_MISTAKES: 4,
  MAX_HINTS: 1,
  LOCKED_DIFFICULTIES: ['hard', 'expert'],
  RATE_LIMIT_CLICKS: 5,
  RATE_LIMIT_WINDOW_MS: 1000,
  RATE_LIMIT_FREEZE_MS: 30000,
  KEY_DAILY: 'sudoku_daily_games_v1',
  KEY_PREMIUM: 'sudoku_is_premium_v1'
};

function isPremium() { return localStorage.getItem(PAYWALL.KEY_PREMIUM) === 'true'; }
function setPremium(v) { localStorage.setItem(PAYWALL.KEY_PREMIUM, v ? 'true' : 'false'); }

// --- 1. Daily game limit ---
function todayStr() { return new Date().toISOString().slice(0, 10); }
function readDaily() {
  try {
    const raw = JSON.parse(localStorage.getItem(PAYWALL.KEY_DAILY));
    if (raw && raw.date === todayStr() && typeof raw.count === 'number') return raw;
  } catch (e) {}
  return { date: todayStr(), count: 0 };
}
function writeDaily(data) { localStorage.setItem(PAYWALL.KEY_DAILY, JSON.stringify(data)); }
function canStartGame() { return isPremium() || readDaily().count < PAYWALL.FREE_DAILY_GAMES; }
function recordGameStart() { const d = readDaily(); d.count += 1; writeDaily(d); }

function showPaywallModal(reason) {
  if (document.getElementById('paywall-modal')) return;
  const isDaily = reason === 'daily';
  const modal = document.createElement('div');
  modal.id = 'paywall-modal';
  modal.className = 'paywall-modal-overlay';
  modal.innerHTML = `
    <div class="paywall-modal glass">
      <h2>${isDaily ? 'Daily Limit Reached' : 'Premium Difficulty'}</h2>
      <p>${isDaily
        ? `You've used all ${PAYWALL.FREE_DAILY_GAMES} free games today. Come back tomorrow, or go Premium for unlimited play.`
        : 'Hard and Expert boards are Premium-only.'}</p>
      <div class="paywall-modal-actions">
        <button id="paywall-upgrade-btn" class="btn-neon" type="button">Upgrade — 0.00 KM (Test Mode)</button>
        <button id="paywall-close-btn" class="btn-ghost" type="button">Maybe Later</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('paywall-close-btn').addEventListener('click', () => modal.remove());
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
  document.getElementById('paywall-upgrade-btn').addEventListener('click', () => {
    if (MOCK_MODE) {
      setPremium(true);
      alert('Mock checkout complete (0.00 KM). Premium unlocked for this browser.');
      modal.remove();
      applyDifficultyLocks();
    }
  });
}

// --- 2. Difficulty gate ---
function applyDifficultyLocks() {
  PAYWALL.LOCKED_DIFFICULTIES.forEach((diff) => {
    const btn = document.getElementById('btn-' + diff);
    if (!btn) return;
    if (isPremium()) {
      btn.classList.remove('locked');
      const lock = btn.querySelector('.lock-icon');
      if (lock) lock.remove();
      return;
    }
    btn.classList.add('locked');
    if (!btn.querySelector('.lock-icon')) {
      const lock = document.createElement('span');
      lock.className = 'lock-icon';
      lock.textContent = '🔒';
      btn.appendChild(lock);
    }
  });
}

// Gate entry point — replaces the old bare newGame(diff) calls from onclick handlers.
function requestNewGame(diff) {
  if (PAYWALL.LOCKED_DIFFICULTIES.includes(diff) && !isPremium()) {
    showPaywallModal('difficulty');
    return;
  }
  if (!canStartGame()) {
    showPaywallModal('daily');
    return;
  }
  recordGameStart();
  newGame(diff);
}

function newGame(diff) {
  currentDiff = diff;
  document.querySelectorAll('.diff-buttons button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + diff).classList.add('active');
  document.getElementById('message').textContent = '';
  gameOver = false;
  mistakeCount = 0;
  hintsUsed = 0;
  updateMistakeDisplay();
  resetHintButton();
  removeGameOverScreen();
  fetch('/puzzle?difficulty=' + diff)
    .then(r => r.json())
    .then(data => {
      puzzle = data.puzzle;
      solution = data.solution;
      renderBoard();
      resetTimer();
    });
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      const val = puzzle[r][c];
      if (val !== 0) {
        cell.classList.add('given');
        cell.textContent = val;
      } else {
        cell.classList.add('editable');
        cell.contentEditable = true;
        cell.addEventListener('keydown', onKey);
        cell.addEventListener('focus', () => {
          document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');
        });
        cell.addEventListener('input', () => {
          const v = cell.textContent.replace(/[^1-9]/g, '');
          cell.textContent = v ? v[v.length-1] : '';
          cell.classList.remove('error', 'correct');
          placeCaretAtEnd(cell);
          if (v && parseInt(v) !== solution[r][c]) {
            if (cell.dataset.countedWrong !== '1') {
              cell.dataset.countedWrong = '1';
              registerMistake();
            }
          } else {
            cell.dataset.countedWrong = '0';
          }
        });
      }
      board.appendChild(cell);
    }
  }
}

function placeCaretAtEnd(el) {
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

function onKey(e) {
  if (!/^[1-9]$/.test(e.key) && !['Backspace','Delete','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
  }
  const r = parseInt(this.dataset.row), c = parseInt(this.dataset.col);
  if (e.key === 'ArrowUp' && r > 0) navigate(r-1, c);
  if (e.key === 'ArrowDown' && r < 8) navigate(r+1, c);
  if (e.key === 'ArrowLeft' && c > 0) navigate(r, c-1);
  if (e.key === 'ArrowRight' && c < 8) navigate(r, c+1);
}

function navigate(r, c) {
  const cells = document.querySelectorAll('.cell');
  cells[r*9+c].focus();
}

function checkBoard() {
  if (gameOver) return;
  const cells = document.querySelectorAll('.cell.editable');
  let allFilled = true, allCorrect = true;
  cells.forEach(cell => {
    const r = parseInt(cell.dataset.row), c = parseInt(cell.dataset.col);
    const val = parseInt(cell.textContent);
    if (!val) { allFilled = false; return; }
    if (val === solution[r][c]) {
      cell.classList.add('correct');
      cell.classList.remove('error');
    } else {
      cell.classList.add('error');
      cell.classList.remove('correct');
      allCorrect = false;
    }
  });
  const msg = document.getElementById('message');
  if (allFilled && allCorrect) {
    msg.textContent = 'Solved! Time: ' + document.getElementById('timer').textContent;
    msg.className = 'win';
    gameOver = true;
    clearInterval(timerInterval);
  } else if (!allFilled) {
    msg.textContent = allCorrect ? 'Looking good so far!' : 'Some cells are wrong. Keep trying!';
    msg.className = allCorrect ? 'win' : 'fail';
  } else {
    msg.textContent = 'Some cells are wrong. Keep trying!';
    msg.className = 'fail';
  }
}

// --- 3. Mistake counter -> neon game over ---
function registerMistake() {
  if (gameOver) return;
  mistakeCount++;
  updateMistakeDisplay();
  if (mistakeCount >= PAYWALL.MAX_MISTAKES) {
    triggerGameOver();
  }
}

function updateMistakeDisplay() {
  document.getElementById('mistake-counter').textContent = 'Mistakes: ' + mistakeCount + '/' + PAYWALL.MAX_MISTAKES;
}

function triggerGameOver() {
  if (document.getElementById('neon-gameover-screen')) return;
  gameOver = true;
  clearInterval(timerInterval);
  document.getElementById('board').classList.add('frozen');

  const screen = document.createElement('div');
  screen.id = 'neon-gameover-screen';
  screen.innerHTML = `
    <div class="neon-gameover-content">
      <h1 class="neon-text-red">GAME OVER</h1>
      <p class="neon-subtext">${PAYWALL.MAX_MISTAKES} mistakes — you're out.</p>
      <button id="neon-retry-btn" class="btn-neon-red" type="button">Try Again</button>
    </div>`;
  document.body.appendChild(screen);
  document.getElementById('neon-retry-btn').addEventListener('click', () => {
    removeGameOverScreen();
    requestNewGame(currentDiff);
  });
}

function removeGameOverScreen() {
  const screen = document.getElementById('neon-gameover-screen');
  if (screen) screen.remove();
  const board = document.getElementById('board');
  if (board) board.classList.remove('frozen');
}

// --- 4. Hint cap ---
function useHint() {
  if (gameOver) return;
  if (!isPremium() && hintsUsed >= PAYWALL.MAX_HINTS) return;
  const cells = document.querySelectorAll('.cell.editable');
  for (const cell of cells) {
    const r = parseInt(cell.dataset.row), c = parseInt(cell.dataset.col);
    if (parseInt(cell.textContent) !== solution[r][c]) {
      cell.textContent = solution[r][c];
      cell.classList.add('correct');
      cell.classList.remove('error');
      cell.dataset.countedWrong = '0';
      break;
    }
  }
  hintsUsed++;
  if (!isPremium() && hintsUsed >= PAYWALL.MAX_HINTS) {
    const btn = document.getElementById('hint-btn');
    btn.disabled = true;
    btn.classList.add('hint-used');
  }
}

function resetHintButton() {
  const btn = document.getElementById('hint-btn');
  btn.disabled = false;
  btn.classList.remove('hint-used');
}

// --- 5. Rate limiter (anti brute-force clicking) ---
let clickTimestamps = [];
let boardFrozen = false;

function registerBoardClick() {
  if (boardFrozen) return false;
  const now = Date.now();
  clickTimestamps.push(now);
  clickTimestamps = clickTimestamps.filter(t => now - t <= PAYWALL.RATE_LIMIT_WINDOW_MS);
  if (clickTimestamps.length > PAYWALL.RATE_LIMIT_CLICKS) {
    freezeBoardForRateLimit();
    return false;
  }
  return true;
}

function freezeBoardForRateLimit() {
  if (boardFrozen) return;
  boardFrozen = true;
  clickTimestamps = [];
  const board = document.getElementById('board');
  board.classList.add('frozen');

  const totalSeconds = PAYWALL.RATE_LIMIT_FREEZE_MS / 1000;
  const overlay = document.createElement('div');
  overlay.id = 'rate-limit-overlay';
  overlay.className = 'rate-limit-overlay';
  overlay.innerHTML = `<div class="rate-limit-content"><p>Whoa, slow down.</p><p class="freeze-timer">${totalSeconds}s</p></div>`;
  board.parentElement.style.position = 'relative';
  board.parentElement.appendChild(overlay);

  let remaining = totalSeconds;
  const tick = setInterval(() => {
    remaining--;
    const t = overlay.querySelector('.freeze-timer');
    if (t) t.textContent = Math.max(remaining, 0) + 's';
    if (remaining <= 0) clearInterval(tick);
  }, 1000);

  setTimeout(() => {
    boardFrozen = false;
    if (!gameOver) board.classList.remove('frozen');
    overlay.remove();
  }, PAYWALL.RATE_LIMIT_FREEZE_MS);
}

document.getElementById('board').addEventListener('mousedown', (e) => {
  if (!registerBoardClick()) {
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}, true);

function resetTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if (!gameOver) { seconds++; updateTimerDisplay(); }
  }, 1000);
}

function updateTimerDisplay() {
  const m = String(Math.floor(seconds/60)).padStart(2,'0');
  const s = String(seconds%60).padStart(2,'0');
  document.getElementById('timer').textContent = m + ':' + s;
}

applyDifficultyLocks();
requestNewGame('easy');
</script>
</body>
</html>
